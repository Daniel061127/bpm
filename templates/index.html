<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Launchpad BPM Controller</title>
  <style>
    :root {
      --bg:         #0d0d1a;
      --panel:      #121228;
      --card:       #1a1a35;
      --border:     #252545;
      --fg:         #e8e8f0;
      --gray:       #4a5568;
      --dim:        #6a7585;
      --green:      #00e87a;
      --green-d:    #003d20;
      --orange:     #ff8c00;
      --orange-d:   #3a1f00;
      --blue:       #4d9fff;
      --blue-d:     #0a2040;
      --red:        #ff4455;
      --red-d:      #3a0010;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* header */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 { font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--gray); text-transform: uppercase; }
    .hdr-right { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--gray); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); transition: background .4s; }
    .dot.on  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .dot.err { background: var(--red);   box-shadow: 0 0 6px var(--red); }

    /* status panel */
    .status-panel {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 22px 32px;
      flex-shrink: 0;
    }
    .now-playing { flex: 1; }
    .now-playing .lbl { font-size: 9px; color: var(--gray); letter-spacing: .2em; text-transform: uppercase; margin-bottom: 6px; }
    #song-name { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }

    .bpm-block { flex: 1; text-align: center; }
    #bpm-num {
      font-family: 'Courier New', monospace;
      font-size: 76px; font-weight: 700;
      color: var(--green); line-height: 1;
      letter-spacing: -2px; transition: color .3s;
    }
    #bpm-num.fading { color: var(--orange); }
    #bpm-num.muted  { color: var(--red); }
    .bpm-lbl { font-size: 11px; color: var(--gray); letter-spacing: .25em; margin-top: 4px; }

    /* 비트 표시기 */
    .beat-dots {
      display: flex; justify-content: center; align-items: center;
      gap: 6px; margin-top: 10px; min-height: 16px;
    }
    .beat-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--border); transition: background .05s, transform .05s, box-shadow .05s;
    }
    .beat-dot.accent { width: 11px; height: 11px; }
    .beat-dot.mid    { width: 9px;  height: 9px; }
    .beat-dot.active-accent {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transform: scale(1.3);
    }
    .beat-dot.active-mid {
      background: var(--blue);
      box-shadow: 0 0 6px var(--blue);
      transform: scale(1.2);
    }
    .beat-dot.active-lo {
      background: var(--dim);
      transform: scale(1.1);
    }
    .beat-dot.fading.active-accent { background: var(--orange); box-shadow: 0 0 8px var(--orange); }

    .status-right {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: flex-end; gap: 12px;
    }
    #status-badge {
      padding: 5px 15px; border-radius: 20px;
      font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      background: var(--card); color: var(--gray);
      border: 1px solid var(--border); transition: all .3s;
    }
    #status-badge.playing { background: var(--green-d); color: var(--green); border-color: var(--green-d); }
    #status-badge.fading  { background: var(--orange-d); color: var(--orange); border-color: var(--orange-d); }
    #status-badge.muted   { background: var(--red-d); color: var(--red); border-color: var(--red-d); }

    /* buttons */
    .controls { display: flex; gap: 8px; }
    .btn {
      padding: 8px 20px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--dim); font-size: 11px; font-weight: 700;
      letter-spacing: .1em; text-transform: uppercase;
      cursor: pointer; transition: all .2s;
    }
    .btn:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }
    .btn:disabled { opacity: .3; cursor: default; }
    .btn.stop-fading { border-color: var(--orange); color: var(--orange); background: var(--orange-d); }
    .btn.muted-active { border-color: var(--red); color: var(--red); background: var(--red-d); }

    .add-btn {
      padding: 6px 16px; border-radius: 8px;
      border: 1px dashed var(--border); background: transparent;
      color: var(--dim); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .2s;
      display: flex; align-items: center; gap: 5px;
    }
    .add-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* table */
    .table-section {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; padding: 14px 22px 0;
    }
    .tbl-head-row {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 10px;
    }
    .tbl-title { font-size: 10px; color: var(--gray); font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    .tbl-scroll {
      flex: 1; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 10px;
      margin-bottom: 14px;
    }
    .tbl-scroll::-webkit-scrollbar { width: 5px; }
    .tbl-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    table { width: 100%; border-collapse: collapse; }
    thead { position: sticky; top: 0; z-index: 1; }
    thead th {
      background: var(--card);
      text-align: left; padding: 9px 12px;
      font-size: 9px; font-weight: 700;
      color: var(--gray); letter-spacing: .15em; text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    .song-row { border-bottom: 1px solid var(--border); transition: background .15s; }
    .song-row:last-child { border-bottom: none; }
    .song-row:hover { background: var(--card); }
    .song-row.active { background: var(--card); }
    td { padding: 9px 12px; vertical-align: middle; }
    .td-num { color: var(--gray); font-family: monospace; width: 36px; }
    .td-name { }
    .td-bpm { width: 90px; }
    .td-ts  { width: 90px; }
    .td-st  { width: 130px; }
    .td-play { width: 42px; }
    .td-del  { width: 36px; text-align: right; }

    .editable {
      background: transparent; border: 1px solid transparent;
      color: var(--fg); font-size: 13px; font-family: inherit;
      padding: 4px 7px; border-radius: 6px; width: 100%;
      transition: border-color .2s, background .2s;
    }
    .editable:focus { outline: none; border-color: var(--blue); background: rgba(77,159,255,.07); }
    .bpm-inp {
      font-family: 'Courier New', monospace;
      font-size: 14px; font-weight: 700; color: var(--blue); width: 72px;
    }
    .ts-sel {
      background: transparent; border: 1px solid transparent;
      color: var(--dim); font-size: 12px; font-family: inherit;
      padding: 4px 4px; border-radius: 6px;
      transition: border-color .2s, background .2s; cursor: pointer;
      width: 72px;
    }
    .ts-sel:focus { outline: none; border-color: var(--blue); background: var(--card); color: var(--fg); }
    .ts-sel option { background: var(--card); color: var(--fg); }

    .row-st { font-size: 12px; color: var(--gray); }
    .row-st.playing { color: var(--green); }
    .row-st.fading  { color: var(--orange); }
    .row-st.muted   { color: var(--red); }

    .play-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--card);
      color: var(--dim); font-size: 11px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .2s;
    }
    .play-btn:hover { border-color: var(--green); color: var(--green); }
    .play-btn.active { border-color: var(--green); color: var(--green); background: var(--green-d); }

    .del-btn {
      width: 24px; height: 24px; border-radius: 5px;
      border: 1px solid transparent; background: transparent;
      color: var(--gray); font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .2s; line-height: 1;
    }
    .del-btn:hover { border-color: var(--red-d); color: var(--red); background: var(--red-d); }

    @keyframes pending-row-pulse {
      0%, 100% { background: rgba(255,140,0,.10); }
      50%       { background: transparent; }
    }
    @keyframes pending-btn-pulse {
      0%, 100% { background: var(--orange-d); border-color: var(--orange); color: var(--orange); }
      50%       { background: transparent;    border-color: var(--border);  color: var(--dim); }
    }
    .song-row.pending { animation: pending-row-pulse .7s ease-in-out infinite; }
    .play-btn.pending { animation: pending-btn-pulse .7s ease-in-out infinite; }

    /* volume bar */
    .vol-row {
      display: flex; align-items: center; gap: 8px;
    }
    .vol-lbl { font-size: 9px; color: var(--gray); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
    .vol-segs { display: flex; gap: 3px; }
    .vol-seg {
      width: 16px; height: 14px; border-radius: 3px;
      background: var(--border); cursor: pointer;
      transition: background .12s;
      border: 1px solid transparent;
    }
    .vol-seg:hover { border-color: var(--green); }
    .vol-seg.active { background: var(--green); }
    .vol-pct { font-size: 10px; color: var(--dim); font-family: monospace; min-width: 32px; }

    /* footer */
    footer {
      padding: 9px 28px; color: var(--gray);
      font-size: 10px; border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 20px; flex-shrink: 0;
    }
    .footer-credit { margin-left: auto; color: var(--dim); font-size: 10px; }
  </style>
</head>
<body>

<header>
  <h1>Launchpad BPM Controller</h1>
  <div class="hdr-right">
    <span id="lp-lbl">확인 중...</span>
    <div class="dot" id="lp-dot"></div>
  </div>
</header>

<div class="status-panel">
  <div class="now-playing">
    <div class="lbl">Now Playing</div>
    <div id="song-name">---</div>
  </div>

  <div class="bpm-block">
    <div id="bpm-num">---</div>
    <div class="bpm-lbl">BPM</div>
    <div class="beat-dots" id="beat-dots"></div>
  </div>

  <div class="status-right">
    <div id="status-badge">STOPPED</div>
    <div class="controls">
      <button class="btn" id="stop-btn" onclick="apiStop()" disabled>Stop</button>
      <button class="btn" id="mute-btn" onclick="apiMute()" disabled>Mute</button>
    </div>
    <div class="vol-row">
      <span class="vol-lbl">VOL</span>
      <div class="vol-segs" id="vol-segs"></div>
      <span class="vol-pct" id="vol-pct">100%</span>
    </div>
  </div>
</div>

<div class="table-section">
  <div class="tbl-head-row">
    <span class="tbl-title">Songs</span>
    <button class="add-btn" onclick="apiAdd()">＋ 곡 추가</button>
  </div>
  <div class="tbl-scroll">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Song Name</th><th>BPM</th><th>박자</th>
          <th>Status</th><th></th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<footer>
  <span>그리드 패드: 곡 재생 (마디 끝 전환)</span>
  <span>패드 19·29: Fade Stop (1초)</span>
  <span>패드 28: Stop | 패드 18: Mute</span>
  <span>6행: 볼륨 (8단계)</span>
  <span class="footer-credit">made by Kangyun Choi / ariseworship.kr</span>
</footer>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  // ── Web Audio API ────────────────────────────────────────
  let audioCtx = null;

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function click(freq, vol, dur = 0.06) {
    if (vol <= 0) return;
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.connect(g);
    g.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(Math.min(vol, 1.0), ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }

  function playBeat(bi, timeSig, vol) {
    if (vol <= 0) return;
    const v = vol * (cur.volume ?? 1.0);
    if (bi === 0)                            click(1600, 0.80 * v);
    else if (timeSig === '6/8' && bi === 3)  click(1200, 0.55 * v);
    else                                     click(900,  0.38 * v);
  }

  // ── 비트 표시기 ──────────────────────────────────────────
  let lastN = 0, lastTs = '';
  let beatTimers = [];

  function buildDots(n, timeSig) {
    const container = document.getElementById('beat-dots');
    container.innerHTML = '';
    beatTimers.forEach(clearTimeout);
    beatTimers = [];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'beat-dot';
      if (i === 0) d.classList.add('accent');
      else if (timeSig === '6/8' && i === 3) d.classList.add('mid');
      container.appendChild(d);
    }
    lastN = n; lastTs = timeSig;
  }

  function flashDots(bi, timeSig) {
    const dots = document.getElementById('beat-dots').children;
    if (!dots.length) return;

    // 이전 활성 제거
    for (const d of dots) d.classList.remove('active-accent','active-mid','active-lo','fading');

    const d = dots[bi];
    if (!d) return;
    const isFading = (cur.status === 'fading');
    if (bi === 0) {
      d.classList.add('active-accent');
      if (isFading) d.classList.add('fading');
    } else if (timeSig === '6/8' && bi === 3) {
      d.classList.add('active-mid');
    } else {
      d.classList.add('active-lo');
    }

    const t = setTimeout(() => {
      d.classList.remove('active-accent','active-mid','active-lo','fading');
    }, 100);
    beatTimers.push(t);
  }

  // ── 상태 ─────────────────────────────────────────────────
  let songs = [];
  let cur   = {status:'stopped', muted:false, bpm:0, song_id:null, song_name:null, pending_song_id:null, launchpad:false, volume:1.0};
  let hadLaunchpad = false;

  const socket = io();
  socket.on('connect',      () => setDot(cur.launchpad));
  socket.on('disconnect', () => {
    document.getElementById('lp-dot').className   = 'dot err';
    document.getElementById('lp-lbl').textContent = '서버 끊김';
  });
  socket.on('state_change', d => { cur = {...cur, ...d}; applyState(); });
  socket.on('beat', d => {
    cur.bpm = d.bpm;
    const bi = d.beat_index || 0;
    const ts = d.time_sig   || '4/4';
    const n  = d.n_beats    || 4;
    const v  = d.vol        != null ? d.vol : 1.0;

    if (n !== lastN || ts !== lastTs) buildDots(n, ts);

    updateBpm();
    flashDots(bi, ts);
    playBeat(bi, ts, v);
  });
  socket.on('songs_update', d => { songs = d; renderTable(); applyState(); });

  Promise.all([
    fetch('/api/songs').then(r => r.json()),
    fetch('/api/state').then(r => r.json()),
  ]).then(([sd, st]) => { songs = sd; cur = st; renderTable(); applyState(); });

  // ── 볼륨 UI ──────────────────────────────────────────────
  (function buildVolSegs() {
    const c = document.getElementById('vol-segs');
    for (let i = 1; i <= 8; i++) {
      const s = document.createElement('div');
      s.className = 'vol-seg';
      s.dataset.step = i;
      s.onclick = () => apiSetVolume(i / 8);
      c.appendChild(s);
    }
  })();

  function updateVolDisplay() {
    const vol   = cur.volume ?? 1.0;
    const level = Math.round(vol * 8);
    const segs  = document.getElementById('vol-segs').children;
    for (let i = 0; i < segs.length; i++) {
      segs[i].classList.toggle('active', i < level);
    }
    document.getElementById('vol-pct').textContent = Math.round(vol * 100) + '%';
  }

  function apiSetVolume(vol) {
    fetch('/api/volume', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({volume: vol}),
    });
  }

  // 첫 번째 사용자 인터랙션으로 AudioContext 초기화
  document.addEventListener('click', () => getCtx(), {once: true});

  // 런치패드 연결 상태 주기적 확인 (3초)
  setInterval(() => {
    fetch('/api/state').then(r => r.json()).then(st => {
      if (st.launchpad !== cur.launchpad) {
        cur.launchpad = st.launchpad;
        setDot(st.launchpad);
      }
    }).catch(() => {});
  }, 3000);

  function applyState() {
    const badge   = document.getElementById('status-badge');
    const nameEl  = document.getElementById('song-name');
    const stopBtn = document.getElementById('stop-btn');
    const muteBtn = document.getElementById('mute-btn');

    nameEl.textContent = cur.song_name || '---';
    updateBpm();
    setDot(cur.launchpad);
    updateVolDisplay();

    const active = cur.status !== 'stopped';
    stopBtn.disabled = !active;
    muteBtn.disabled = !active;
    stopBtn.className = 'btn' + (cur.status === 'fading' ? ' stop-fading' : '');
    muteBtn.className = 'btn' + (cur.muted ? ' muted-active' : '');

    if (!active) {
      document.getElementById('beat-dots').innerHTML = '';
      lastN = 0; lastTs = '';
    }

    let bt = 'STOPPED', bc = '';
    if (cur.muted && active)         { bt = 'MUTED';   bc = 'muted';   }
    else if (cur.status === 'playing') { bt = 'PLAYING'; bc = 'playing'; }
    else if (cur.status === 'fading')  { bt = 'FADING…'; bc = 'fading';  }
    badge.textContent = bt;
    badge.className   = bc;

    document.querySelectorAll('.song-row').forEach(tr => {
      const id      = parseInt(tr.dataset.id);
      const on      = (id === cur.song_id);
      const pending = (!on && id === cur.pending_song_id);
      tr.classList.toggle('active',  on);
      tr.classList.toggle('pending', pending);
      tr.querySelector('.play-btn').classList.toggle('active',  on);
      tr.querySelector('.play-btn').classList.toggle('pending', pending);
      const st = tr.querySelector('.row-st');
      if (on) {
        if (cur.muted)                     { st.textContent = '⊘ Muted';   st.className = 'row-st muted';   }
        else if (cur.status === 'playing') { st.textContent = '▶ Playing'; st.className = 'row-st playing'; }
        else if (cur.status === 'fading')  { st.textContent = '⟳ Fading';  st.className = 'row-st fading';  }
        else                               { st.textContent = '●';          st.className = 'row-st';         }
      } else if (pending) {
        st.textContent = '⟳ 대기중'; st.className = 'row-st fading';
      } else {
        st.textContent = '●'; st.className = 'row-st';
      }
    });
  }

  function updateBpm() {
    const el = document.getElementById('bpm-num');
    el.textContent = cur.bpm > 0 ? Math.round(cur.bpm) : '---';
    el.className   = cur.muted ? 'muted' : (cur.status === 'fading' ? 'fading' : '');
  }

  function setDot(on) {
    const dot = document.getElementById('lp-dot');
    const lbl = document.getElementById('lp-lbl');
    if (on) {
      hadLaunchpad = true;
      dot.className   = 'dot on';
      lbl.textContent = '런치패드 연결됨';
    } else if (hadLaunchpad) {
      dot.className   = 'dot err';
      lbl.textContent = '런치패드 연결 끊김';
    } else {
      dot.className   = 'dot';
      lbl.textContent = '런치패드 없음';
    }
  }

  // ── 테이블 렌더링 ──────────────────────────────────────
  const TS_OPTS = ['4/4', '3/4', '2/4', '6/8'];

  function renderTable() {
    const tbody   = document.getElementById('tbody');
    const focRow  = document.activeElement?.closest('tr')?.dataset?.id;
    const focFld  = document.activeElement?.dataset?.field;

    tbody.innerHTML = '';
    songs.forEach((song, i) => {
      const tsOpts = TS_OPTS.map(v =>
        `<option value="${v}"${(song.time_sig || '4/4') === v ? ' selected' : ''}>${v}</option>`
      ).join('');

      const tr = document.createElement('tr');
      tr.className  = 'song-row';
      tr.dataset.id = song.id;
      tr.innerHTML  = `
        <td class="td-num">${i + 1}</td>
        <td class="td-name">
          <input class="editable" data-field="name" value="${esc(song.name)}"
            onblur="save(${song.id},'name',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
        </td>
        <td class="td-bpm">
          <input class="editable bpm-inp" data-field="bpm" type="number"
            value="${song.bpm}" min="20" max="400"
            onblur="save(${song.id},'bpm',this.value)"
            onkeydown="if(event.key==='Enter')this.blur()">
        </td>
        <td class="td-ts">
          <select class="ts-sel" onchange="save(${song.id},'time_sig',this.value)">${tsOpts}</select>
        </td>
        <td class="td-st"><span class="row-st">●</span></td>
        <td class="td-play">
          <button class="play-btn" onclick="apiPlay(${song.id})">▶</button>
        </td>
        <td class="td-del">
          <button class="del-btn" onclick="apiDel(${song.id})" title="삭제">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
    });

    if (focRow && focFld) {
      const tr = tbody.querySelector(`tr[data-id="${focRow}"]`);
      if (tr) tr.querySelector(`[data-field="${focFld}"]`)?.focus();
    }
  }

  // ── API ────────────────────────────────────────────────
  const post = url => fetch(url, {method: 'POST'});

  function apiPlay(id) { post(`/api/play/${id}`); }
  function apiStop()   { post('/api/stop'); }
  function apiMute()   { post('/api/mute'); }
  function apiAdd()    { fetch('/api/songs', {method:'POST'}).then(r=>r.json()).then(d=>{if(d.error)alert(d.error);}); }
  function apiDel(id)  { fetch(`/api/songs/${id}`, {method:'DELETE'}); }

  function save(id, field, value) {
    const body = {};
    if (field === 'bpm') {
      const n = parseInt(value);
      if (isNaN(n) || n < 20 || n > 400) return;
      body[field] = n;
    } else {
      const v = value?.trim?.() ?? value;
      if (field === 'name' && !v) return;
      body[field] = v;
    }
    const s = songs.find(s => s.id === id);
    if (s) s[field] = body[field];
    fetch(`/api/songs/${id}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
